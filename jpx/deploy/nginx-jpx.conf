# پورتال JPX — دامنه اصلی (jpx.ir / jpzx.ir) + پاسخ پیش‌فرض برای IP سرور
# محل نصب: /etc/nginx/sites-available/jpx

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    root /var/www/jpx/site;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript application/json text/plain image/svg+xml;
    gzip_min_length 512;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~* \.(?:css|js|svg|png|jpe?g|webp|woff2)$ {
        expires 7d;
        try_files $uri =404;
    }

    location / {
        expires -1;
        try_files $uri $uri/ =404;
    }
}

server {
    listen 80;
    listen [::]:80;

    server_name jpx.ir www.jpx.ir jpzx.ir www.jpzx.ir;

    root /var/www/jpx/site;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript application/json text/plain image/svg+xml;
    gzip_min_length 512;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~* \.(?:css|js|svg|png|jpe?g|webp|woff2)$ {
        expires 7d;
        try_files $uri =404;
    }

    location / {
        expires -1;
        try_files $uri $uri/ =404;
    }
}
