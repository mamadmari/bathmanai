# پورتال Bathmanai — دامنه اصلی (bathmanai.ir) + پاسخ پیش‌فرض برای IP سرور
# محل نصب: /etc/nginx/sites-available/bathmanai

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    root /var/www/bathmanai/site;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript application/json text/plain image/svg+xml;
    gzip_min_length 512;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;

    location = /blupaper { return 301 https://blupaper.bathmanai.ir/; }
    location = /shop { return 301 https://blupaper.bathmanai.ir/; }

# مسیر ربات دانلودر روی دامنه اصلی — داخل بلوک server «bathmanai.ir» قرار می‌گیرد
location = /dlbot {
    return 301 /dlbot/;
}

location /dlbot/ {
    proxy_pass http://127.0.0.1:8792;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "";
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
    client_max_body_size 8m;
}

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~* \.(?:css|js|svg|png|jpe?g|webp|woff2)$ {
        expires 7d;
        try_files $uri =404;
    }

    location / {
        expires -1;
        try_files $uri $uri/ =404;
    }
}

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name bathmanai.ir www.bathmanai.ir;

    ssl_certificate /etc/letsencrypt/live/bathmanai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bathmanai/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:5m;
    ssl_session_timeout 1h;

    root /var/www/bathmanai/site;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript application/json text/plain image/svg+xml;
    gzip_min_length 512;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;

    location = /blupaper { return 301 https://blupaper.bathmanai.ir/; }
    location = /shop { return 301 https://blupaper.bathmanai.ir/; }

