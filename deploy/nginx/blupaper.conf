# فروشگاه بلو پیپر — blupaper.bathmanai.ir (HTTP + HTTPS)
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name blupaper.bathmanai.ir;

    ssl_certificate /etc/letsencrypt/live/bathmanai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bathmanai/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:5m;
    ssl_session_timeout 1h;

    root /var/www/blupaper/site;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript application/json text/plain image/svg+xml;
    gzip_min_length 512;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;

    location ~* \.(?:css|js|svg|png|jpe?g|webp|woff2)$ {
        expires 7d;
        try_files $uri =404;
    }

    location / {
        expires -1;
        try_files $uri $uri/ =404;
    }
}
